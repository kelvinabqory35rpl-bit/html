<!DOCTYPE html>>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <title>Form Pendaftaran</title>
        <body>
            <form>
                <table>
                    <tr>
                        <td><label>Tanggal Lahir</label></td>
                        <td><input type="date"></td>
                    </tr>
                    <tr>
                        <td><label>Alamat</label></td>
                        <td><textarea rows="4" cols="30"></textarea></td>
                    </tr>
                    <tr>
                        <td><label>Email</label></td>
                        <td><input type="email"></td>

                    </tr>
                    <tr>
                        <td><label>Password</label></td>
                        <td><input type="password"></td>
                        <tr>
                            <td><label>Jenis Kelamin</label></td>
                            <td>
                                <input type="radio" name="Jenis Kelamin"> Laki-laki
                                <input type="radio" name="Jenis Kelamin"> Perempuan
                            </td>
                        </tr>
                    </tr>
                    <tr>
                        <td><label>Hobi</label></td>
                        <td>
                            <input type="checkbox">Tidur
                            <input type="checkbox">Olahraga
                            <input type="checkbox">Game
                            <input type="checkbox">Sepak Bola
                            <input type="checkbox">Berenang
                            <input type="checkbox">Ngoding

                        </td>
                    </tr>
                    <tr>
                        <td><label>Jurusan</label></td>
                        <td>
                            <select>
                                <option>RPl</option>
                                <option>TKJ</option>
                                <option>PG</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td><label>Upload Foto</label></td>
                        <td><input type="file"></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td><button type="submit">Kirim</button></td>
                    </tr>
                </table>
            </form>

        </body>
    </head>
</html>
